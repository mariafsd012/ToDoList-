    <title>TodoList</title>

<body>
    <div class="main-wrapper">
        <svg id="visual" viewBox="0 0 960 540" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="none">
            <rect x="0" y="0" width="960" height="540" fill="#F0CDD2"></rect>

        <div class="content-box">
            <h1>Bem-vindo ao TodoList</h1>
            <p>Organize suas tarefas diárias de forma eficiente e fácil.</p>

            <div class="botoes">
                <button class="botao" id="entrarBtn">Entrar</button>
            </div>
        </div>

    <script>
        const entrarBtn = document.getElementById('entrarBtn');
        entrarBtn.addEventListener('click', function () {
        window.location.href = 'login.html';
        });

        /*a const identifica o botão "Entrar" usando seu ID e adiciona um 
        ouvinte de evento de clique. Quando o botão é clicado, a função 
        redireciona o usuário para a página "login.html" usando 
        window.location.href.*/
    </script>
